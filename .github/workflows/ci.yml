name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    # Fresh renderer verification took29m14s in run37674667084, before the new
    # original-density foreground case. Hosted runner speed varies about 2x: run 38512519316
    # took 36 min where unchanged classes (e.g. GlassTabBarV3GestureTest, 350 s against 183 s
    # in run 38461707949) ran about 1.9x slower. Leave execution/upload headroom; test
    # timeouts and optical tolerances are unchanged.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Save the local task cache for trusted PR updates too. GitHub scopes it to this PR;
          # forked PRs remain read-only and cannot populate our build cache through this job.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Build library, Android sample and desktop; run production renderer tests
        # The Material 3 renders run in their own job (material3), in parallel.
        run: ./gradlew build -x :liquidglass-material3:jvmTest --stacktrace
      - name: Upload test reports and rendered evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/atlas/**
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 14
  material3:
    runs-on: ubuntu-24.04
    # Nine phone-sized glass renders and interaction checks: about 12 min locally, 22 min on the
    # first hosted run (39147674357).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Material 3 glass components (renders and interaction)
        run: ./gradlew :liquidglass-material3:jvmTest --stacktrace
      - name: Upload Material 3 renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: material3-reports
          path: |
            liquidglass-material3/build/reports/**
            liquidglass-material3/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 14
  gradle-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Gradle plugin (codemod unit tests, TestKit builds)
        run: ./gradlew -p gradle-plugin test --stacktrace
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high


  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ports/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Install production Skia preview for browser integration tests
        run: npm ci --ignore-scripts --prefix ../skia
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: web-renderer-proof
          path: |
            ports/web/playwright-report/
            ports/web/test-results/
          retention-days: 14

  skia-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ports/skia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/skia/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run example
      - name: Verify native motion fixtures match the portable controller
        run: node ../dotnet/generate-motion-fixtures.mjs --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: skia-renderer-proof
          path: ports/skia/build/*.png
          if-no-files-found: ignore
          retention-days: 14

  dotnet-port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Linux font provider and example font
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1 fonts-dejavu-core
      - run: dotnet restore ports/dotnet/Checks/Checks.csproj --locked-mode
      - run: dotnet build ports/dotnet/Checks/Checks.csproj --no-restore
      - run: dotnet ports/dotnet/Checks/bin/Debug/net8.0/Checks.dll ports/dotnet/artifacts
      - name: Pack the NuGet packages (not published) and check their contents
        shell: bash
        run: |
          dotnet pack ports/dotnet/LiquidGlass.Skia/LiquidGlass.Skia.csproj -c Release -o ports/dotnet/artifacts/nuget
          if [ "$RUNNER_OS" = "Windows" ]; then
            dotnet pack ports/dotnet/LiquidGlass.WinForms/LiquidGlass.WinForms.csproj -c Release -o ports/dotnet/artifacts/nuget
            node ports/dotnet/check-packages.mjs ports/dotnet/artifacts/nuget --winforms
          else
            node ports/dotnet/check-packages.mjs ports/dotnet/artifacts/nuget
          fi
      - name: Build Windows Forms host
        if: runner.os == 'Windows'
        run: |
          dotnet restore ports/dotnet/WinFormsDemo/WinFormsDemo.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ports/dotnet/WinFormsDemo/WinFormsDemo.csproj --no-restore
      - name: Verify owned native control backdrops
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: dotnet ports/dotnet/WinFormsDemo/bin/Debug/net10.0-windows10.0.19041.0/WinFormsDemo.dll --controls --capture ports/dotnet/artifacts/controls
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dotnet-renderer-proof-${{ matrix.os }}
          path: ports/dotnet/artifacts/
          if-no-files-found: ignore
          retention-days: 14
