name: Publish

# Pushing a tag `vX.Y.Z` publishes that version everywhere at once:
#   Maven Central  liquidglass, liquidglass-material3, liquidglass-bom, and the Gradle plugin
#   npm            @shayxo.dev/liquidglass (the <liquid-glass> web component), @shayxo.dev/liquidglass-react-native
#   NuGet          LiquidGlass, LiquidGlass.WinForms, LiquidGlass.Wpf, LiquidGlass.Avalonia
# then creates the GitHub release from .github/release-notes/vX.Y.Z.md.
#
# The `check` job refuses before anything is uploaded unless the tag matches VERSION_NAME, the version
# is not a SNAPSHOT, the tagged commit is on main and passed CI there, and the release notes exist.
# Each channel is its own job, so one failure (a missing secret, a registry outage) leaves the others
# published and is fixed with `gh run rerun <id> --failed`; npm and NuGet skip versions already there.
# The secrets are described in docs/publishing.md.
#
# A pull request that touches the release files runs the same jobs as a dry run: everything is built,
# packed and checked, nothing is uploaded and no secret is read.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/scripts/set_version.py
      - .github/release-notes/**
      - gradle.properties
      - gradle-plugin/build.gradle.kts
      - ports/npm/package.json
      - ports/react-native/package.json
      - ports/dotnet/Package.props

permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  DRY_RUN: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: version
        name: Version, tag, CI result and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then echo "Dry run of $version: nothing will be uploaded"; exit 0; fi
          fail() { echo "::error::$1"; exit 1; }
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || fail "tag $GITHUB_REF_NAME does not match VERSION_NAME=$version"
          case "$version" in *SNAPSHOT*) fail "$version is a SNAPSHOT: set the release version first (.github/scripts/set_version.py)";; esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "the tagged commit is not on main"
          ci=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$ci" -gt 0 ] || fail "CI has not passed on main for $GITHUB_SHA; wait for it, then rerun this workflow"
          [ -f ".github/release-notes/v$version.md" ] || fail "missing .github/release-notes/v$version.md"
          # GitHub occasionally starts a tag's run twice. The concurrency group queues the second one,
          # but by then the registries may not show the first upload yet (v0.2.1), so stand down here.
          done=$(gh run list --workflow publish.yml --branch "$GITHUB_REF_NAME" --event push --json databaseId,conclusion             --jq "[.[] | select(.conclusion == \"success\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$done" -gt 0 ]; then
            echo "::notice::$GITHUB_REF_NAME was already published by an earlier run of this workflow; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Publishing $version"

  maven-library:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true
      - name: Dry run (publish to the runner's local repository)
        if: env.DRY_RUN == 'true'
        run: |
          ./gradlew :liquidglass:publishToMavenLocal :liquidglass-material3:publishToMavenLocal :liquidglass-bom:publishToMavenLocal --no-configuration-cache --stacktrace
          ls -R ~/.m2/repository/dev/shayxo/liquidglass | grep -E '\.(pom|module|aar|jar|klib)$'
      - name: Publish to Maven Central
        if: env.DRY_RUN != 'true'
        run: |
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] \
            || { echo "::error::Maven Central or signing secrets are missing (docs/publishing.md)"; exit 1; }
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  maven-plugin:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true
      - name: Test the plugin
        run: ./gradlew -p gradle-plugin test --stacktrace
      - name: Dry run (publish to the runner's local repository)
        if: env.DRY_RUN == 'true'
        run: |
          ./gradlew -p gradle-plugin publishToMavenLocal --no-configuration-cache --stacktrace
          ls -R ~/.m2/repository/dev/shayxo/liquidglass | grep -E '\.(pom|module|jar)$'
      - name: Publish the Gradle plugin and its marker to Maven Central
        if: env.DRY_RUN != 'true'
        run: |
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] \
            || { echo "::error::Maven Central or signing secrets are missing (docs/publishing.md)"; exit 1; }
          ./gradlew -p gradle-plugin publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  npm:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing once the package trusts this workflow
    defaults:
      run:
        working-directory: ports/npm
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11: trusted publishing (OIDC) needs npm 11.5.1+
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Unit, provenance, vendored-file and type checks
        run: npm test
      - name: Stamp the version (the repository keeps the package private and unversioned)
        run: |
          npm pkg set version="$VERSION"
          npm pkg delete private
          npm pack --dry-run
      - name: Publish
        run: |
          tag=latest; case "$VERSION" in *-*) tag=next;; esac
          if [ "$DRY_RUN" = true ]; then npm publish --dry-run --tag "$tag"; exit 0; fi
          # Trusted publishing: npm exchanges the run's OIDC token (id-token: write) for a one-time
          # credential. The package trusts publish.yml in this repository; no token is stored.
          if npm view "@shayxo.dev/liquidglass@$VERSION" version >/dev/null 2>&1; then echo "already on npm"; exit 0; fi
          npm publish --provenance --access public --tag "$tag"

  npm-react-native:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing once the package trusts this workflow
    defaults:
      run:
        working-directory: ports/react-native
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11: trusted publishing (OIDC) needs npm 11.5.1+
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ports/react-native/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Vendored painter, adapter against CanvasKit, components, types
        run: npm test
      - name: Stamp the version (the repository keeps the package private and unversioned)
        run: |
          npm pkg set version="$VERSION"
          npm pkg delete private
          npm pack --dry-run
      - name: Publish
        run: |
          tag=latest; case "$VERSION" in *-*) tag=next;; esac
          if [ "$DRY_RUN" = true ]; then npm publish --dry-run --tag "$tag"; exit 0; fi
          # Trusted publishing: npm exchanges the run's OIDC token (id-token: write) for a one-time
          # credential. The package trusts publish.yml in this repository; no token is stored.
          if npm view "@shayxo.dev/liquidglass-react-native@$VERSION" version >/dev/null 2>&1; then echo "already on npm"; exit 0; fi
          npm publish --provenance --access public --tag "$tag"

  nuget:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2025 # WinForms and WPF pack only on Windows
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing: the workflow's identity, no stored key
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pack and check the packages
        shell: bash
        run: |
          for p in LiquidGlass.Skia LiquidGlass.WinForms LiquidGlass.Wpf LiquidGlass.Avalonia; do
            dotnet pack "ports/dotnet/$p/$p.csproj" -c Release -o ports/dotnet/artifacts/nuget || exit 1
          done
          node ports/dotnet/check-packages.mjs ports/dotnet/artifacts/nuget --winforms --wpf --avalonia
          ls ports/dotnet/artifacts/nuget
      # Trusted publishing: nuget.org's policy for shayxo.dev trusts this repository's publish.yml and
      # exchanges the run's OIDC token for an API key that lives an hour (docs/publishing.md).
      - name: Sign in to nuget.org
        if: env.DRY_RUN != 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: shayxo.dev
      - name: Publish (to a local feed in a dry run)
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          source=https://api.nuget.org/v3/index.json
          if [ "$DRY_RUN" = true ]; then source="$RUNNER_TEMP/nuget-feed"; mkdir -p "$source"; fi
          # The .snupkg symbol packages beside them are pushed with them. Bash expands the glob: on the
          # Windows runner, dotnet given the quoted relative wildcard reported that it does not exist.
          for f in ports/dotnet/artifacts/nuget/*.nupkg; do
            dotnet nuget push "$f" --api-key "${NUGET_API_KEY:-dry-run}" --source "$source" --skip-duplicate
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: ports/dotnet/artifacts/nuget/
          retention-days: 14

  github-release:
    needs: [check, maven-library, maven-plugin, npm, npm-react-native, nuget]
    if: github.event_name == 'push' && needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create the GitHub release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION exists"; exit 0; fi
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file ".github/release-notes/v$VERSION.md" $pre
