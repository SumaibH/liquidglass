# The documentation site, published to https://liquidglass.shayxo.dev/ by
# .github/workflows/docs.yml on every push to main.
#
# The site's home page is docs/README.md, the documentation index. The repository's own
# README.md is the landing page and stays where GitHub shows it; it is not part of this site.
# Build it locally with:  pip install mkdocs-material && mkdocs serve

site_name: LiquidGlass
site_url: https://liquidglass.shayxo.dev/
site_description: >-
  Liquid Glass for every stack, measured against iOS: Apple's iOS 26 glass for Android, Jetpack
  Compose, desktop, web, React Native, Flutter and .NET. Refraction, dispersion and touch response
  fitted to iOS screen recordings.
site_author: Shayan Khan
copyright: Apache-2.0. Not affiliated with, endorsed by, or derived from Apple.

repo_url: https://github.com/shayann07/liquidglass
repo_name: shayann07/liquidglass
edit_uri: edit/main/docs/

# A link that does not resolve is a broken promise on a documentation site, so the build fails
# rather than shipping one.
strict: true

# Keep incoming original recordings local; publish only inspected evidence crops.
exclude_docs: |
  /1.MP4
  /2.MP4
  /overrides/

theme:
  name: material
  # Link previews (OpenGraph and Twitter cards) and per-page meta descriptions; see main.html.
  custom_dir: docs/overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shayann07/liquidglass
      name: The repository
    - icon: fontawesome/solid/cube
      link: https://central.sonatype.com/artifact/dev.shayxo.liquidglass/liquidglass
      name: Maven Central
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@shayxo.dev/liquidglass
      name: npm
    - icon: fontawesome/solid/box
      link: https://www.nuget.org/packages/LiquidGlass
      name: NuGet

