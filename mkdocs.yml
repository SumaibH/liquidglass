      - Material 3, in glass: material3.md
      - How it works: how-it-works.md
      - Shapes: shapes.md
      - Interaction: interaction.md
      - Generic interaction: generic-interaction.md
      - Atlas Studio: atlas-studio.md
      - Other UI stacks: porting.md
      - Web component: web-component.md
      - React Native: react-native.md
      - Flutter: flutter.md
      - .NET (WinForms, WPF, Avalonia, MAUI): native-dotnet.md
      - Adaptation: adaptation.md
